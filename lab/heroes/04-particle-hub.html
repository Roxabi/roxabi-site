<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 04 — Particle hub · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
/* hero-specific CSS only */

/* Two-column layout: copy left, canvas right */
.hero {
  padding-block: 0;
}

.hero-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  min-height: calc(100svh - 60px);
  gap: 0;
}

/* Left: copy column */
.hero-copy {
  display: flex;
  flex-direction: column;
  gap: var(--s-lg);
  padding-block: var(--s-2xl);
  padding-right: var(--s-xl);
  position: relative;
  z-index: 2;
}

.hero-copy .badge {
  align-self: flex-start;
}

.hero-sub {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  font-family: var(--font-sans);
  letter-spacing: -.01em;
}

.hero-lead {
  font-size: 1.075rem;
  line-height: 1.65;
  color: var(--text-muted);
  max-width: 42ch;
}

.hero-ctas {
  display: flex;
  gap: var(--s-md);
  flex-wrap: wrap;
  align-items: center;
  padding-top: var(--s-xs);
}

/* Right: canvas column */
.hero-canvas-col {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  height: calc(100svh - 60px);
}

#hub {
  display: block;
  width: 100%;
  height: 100%;
}

/* Mobile: stack vertically, canvas becomes dim background */
@media (max-width: 820px) {
  .hero-inner {
    grid-template-columns: 1fr;
    position: relative;
  }

  .hero-canvas-col {
    position: absolute;
    inset: 0;
    height: 100%;
    opacity: 0.28;
    pointer-events: none;
    z-index: 0;
  }

  #hub {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hero-copy {
    padding-right: 0;
    padding-block: var(--s-2xl);
    z-index: 2;
    min-height: calc(100svh - 60px);
    justify-content: center;
  }

  .hero-lead {
    max-width: 100%;
  }
}

@media (max-width: 480px) {
  .hero-copy h1 {
    font-size: clamp(2rem, 10vw, 2.75rem);
  }

  .hero-ctas {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">04 · particle hub</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="hero-inner wrap">
      <!-- Copy column -->
      <div class="hero-copy">
        <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        <h1>One person.<br>Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>

      <!-- Canvas column -->
      <div class="hero-canvas-col">
        <canvas id="hub" aria-hidden="true"></canvas>
      </div>
    </div>
  </section>
</main>
<script>
/* canvas hub — reduced-motion + visibility guarded */
(function () {
  'use strict';

  const canvas = document.getElementById('hub');
  const ctx = canvas.getContext('2d');

  /* ── Design tokens (must match tokens.css) ─────────────── */
  const T = {
    accent:     '#f0b429',
    accentDim:  'rgba(240,180,41,0.55)',
    accentGlow: 'rgba(240,180,41,0.22)',
    border:     '#21262d',
    borderHi:   '#30363d',
    textMuted:  '#9ca3af',
    textDim:    '#6b7280',
    bg:         '#0d1117',
    surface:    '#161b22',
    fontMono:   "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace",
  };

  /* ── Reduced-motion guard ───────────────────────────────── */
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ── DPR-aware sizing (cap at 2) ────────────────────────── */
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (prefersReduced.matches) { drawStatic(); }
  }

  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  resize();

  /* ── Hub geometry ───────────────────────────────────────── */
  const NODES = [
    { id: 'llmCLI',   angle: 0 },
    { id: 'voiceCLI', angle: Math.PI * 2 / 6 },
    { id: 'imageCLI', angle: Math.PI * 4 / 6 },
    { id: 'cortex',   angle: Math.PI },
    { id: 'intel',    angle: Math.PI * 8 / 6 },
    { id: 'idna',     angle: Math.PI * 10 / 6 },
  ];

  /* ── Particles ──────────────────────────────────────────── */
  const MAX_PARTICLES = 36; /* cap: 6 per edge */
  const particles = [];

  function makeParticle(nodeIdx) {
    return {
      node: nodeIdx,
      t: Math.random(),          /* 0 = at node, 1 = at core */
      speed: 0.0028 + Math.random() * 0.0022,
      size: 2.0 + Math.random() * 1.5,
      opacity: 0.5 + Math.random() * 0.5,
    };
  }

  /* seed particles evenly across nodes */
  for (let i = 0; i < MAX_PARTICLES; i++) {
    const p = makeParticle(i % NODES.length);
    p.t = i / MAX_PARTICLES;     /* spread them out immediately */
    particles.push(p);
  }

  /* ── Slow ring rotation state ────────────────────────────── */
  let ringAngle = 0;
  const RING_SPEED = 0.00012; /* rad/ms — full rotation ≈ 87 s */

  /* ── Pulse state ─────────────────────────────────────────── */
  let pulsePhase = 0;
  const PULSE_SPEED = 0.0015; /* rad/ms */

  /* ── rAF loop ────────────────────────────────────────────── */
  let rafId = null;
  let lastTime = null;

  function tick(now) {
    if (document.hidden) { lastTime = null; rafId = requestAnimationFrame(tick); return; }
    if (lastTime === null) lastTime = now;
    const dt = Math.min(now - lastTime, 50); /* clamp spike frames */
    lastTime = now;

    ringAngle  += RING_SPEED  * dt;
    pulsePhase += PULSE_SPEED * dt;

    /* advance particles */
    for (const p of particles) {
      p.t += p.speed;
      if (p.t >= 1) {
        /* respawn from node */
        p.t      = 0;
        p.speed  = 0.0028 + Math.random() * 0.0022;
        p.opacity = 0.5 + Math.random() * 0.5;
      }
    }

    drawFrame(ringAngle, pulsePhase, particles);
    rafId = requestAnimationFrame(tick);
  }

  function startLoop() {
    if (rafId !== null) return;
    lastTime = null;
    rafId = requestAnimationFrame(tick);
  }

  function stopLoop() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  }

  /* ── Geometry helpers ────────────────────────────────────── */
  function ringRadius() {
    return Math.min(W, H) * 0.33;
  }

  function coreRadius() {
    return Math.min(W, H) * 0.045;
  }

  function nodeRadius() {
    return Math.min(W, H) * 0.028;
  }

  function cx() { return W / 2; }
  function cy() { return H / 2; }

  function nodePos(idx, rAngle) {
    const base = NODES[idx].angle;
    const a = base + rAngle;
    const r = ringRadius();
    return { x: cx() + Math.cos(a) * r, y: cy() + Math.sin(a) * r };
  }

  /* ── Draw ─────────────────────────────────────────────────── */
  function drawFrame(rAngle, pulse, pts) {
    ctx.clearRect(0, 0, W, H);
    drawEdges(rAngle);
    drawParticles(pts, rAngle);
    drawNodes(rAngle, pulse);
    drawCore(pulse);
    drawLabels(rAngle);
  }

  function drawEdges(rAngle) {
    for (let i = 0; i < NODES.length; i++) {
      const np = nodePos(i, rAngle);
      ctx.beginPath();
      ctx.moveTo(np.x, np.y);
      ctx.lineTo(cx(), cy());
      ctx.strokeStyle = T.border;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles(pts, rAngle) {
    for (const p of pts) {
      const np = nodePos(p.node, rAngle);
      /* lerp from node → core */
      const px = np.x + (cx() - np.x) * p.t;
      const py = np.y + (cy() - np.y) * p.t;

      /* fade in near node, fade out near core */
      const fadeIn  = Math.min(p.t * 6, 1);
      const fadeOut = Math.min((1 - p.t) * 6, 1);
      const alpha   = p.opacity * fadeIn * fadeOut;

      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fillStyle = T.accent;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawNodes(rAngle, pulse) {
    const nr = nodeRadius();
    const pulseMag = Math.sin(pulse) * 0.15 + 1; /* 0.85–1.15 */

    for (let i = 0; i < NODES.length; i++) {
      const np = nodePos(i, rAngle);
      /* stagger pulses per node */
      const nodePhase = pulse + (i * Math.PI * 2 / NODES.length);
      const pm = Math.sin(nodePhase) * 0.12 + 1;
      const r = nr * pm;

      /* outer ring glow */
      const grad = ctx.createRadialGradient(np.x, np.y, r * 0.4, np.x, np.y, r * 2.2);
      grad.addColorStop(0, 'rgba(240,180,41,0.12)');
      grad.addColorStop(1, 'rgba(240,180,41,0)');
      ctx.beginPath();
      ctx.arc(np.x, np.y, r * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      /* node body */
      ctx.beginPath();
      ctx.arc(np.x, np.y, r, 0, Math.PI * 2);
      ctx.fillStyle = T.surface;
      ctx.fill();
      ctx.strokeStyle = T.borderHi;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      /* inner amber dot */
      ctx.beginPath();
      ctx.arc(np.x, np.y, r * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = T.accentDim;
      ctx.fill();
    }
  }

  function drawCore(pulse) {
    const cr = coreRadius();
    const pm = Math.sin(pulse * 0.7) * 0.08 + 1;
    const r  = cr * pm;
    const x  = cx(), y = cy();

    /* multi-layer glow */
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 4.5);
    glow.addColorStop(0,   'rgba(240,180,41,0.38)');
    glow.addColorStop(0.3, 'rgba(240,180,41,0.14)');
    glow.addColorStop(1,   'rgba(240,180,41,0)');
    ctx.beginPath();
    ctx.arc(x, y, r * 4.5, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    /* core body */
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = T.accent;
    ctx.fill();

    /* core ring */
    ctx.beginPath();
    ctx.arc(x, y, r * 1.55, 0, Math.PI * 2);
    ctx.strokeStyle = T.accentDim;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawLabels(rAngle) {
    const nr  = nodeRadius();
    const labelOffset = nr * 2.6 + ringRadius() * 0.06;

    ctx.font        = `600 11px ${T.fontMono}`;
    ctx.fillStyle   = T.textMuted;
    ctx.textBaseline = 'middle';

    for (let i = 0; i < NODES.length; i++) {
      const base = NODES[i].angle;
      const a    = base + rAngle;
      const r    = ringRadius() + labelOffset;
      const lx   = cx() + Math.cos(a) * r;
      const ly   = cy() + Math.sin(a) * r;

      /* anchor by quadrant for clean alignment */
      const cos = Math.cos(a);
      if (cos > 0.25)       ctx.textAlign = 'left';
      else if (cos < -0.25) ctx.textAlign = 'right';
      else                  ctx.textAlign = 'center';

      ctx.fillText(NODES[i].id, lx, ly);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  /* ── Static frame (reduced-motion) ──────────────────────── */
  function drawStatic() {
    ctx.clearRect(0, 0, W, H);
    drawEdges(0);
    drawNodes(0, Math.PI / 4);   /* mid-pulse */
    drawCore(Math.PI / 4);
    drawLabels(0);
    /* draw a single particle per edge at t=0.5 for visual clarity */
    for (let i = 0; i < NODES.length; i++) {
      const np = nodePos(i, 0);
      const px = np.x + (cx() - np.x) * 0.5;
      const py = np.y + (cy() - np.y) * 0.5;
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = T.accent;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  /* ── Visibility API pause ─────────────────────────────────── */
  document.addEventListener('visibilitychange', () => {
    if (prefersReduced.matches) return;
    if (document.hidden) stopLoop();
    else startLoop();
  });

  /* ── Boot ─────────────────────────────────────────────────── */
  if (prefersReduced.matches) {
    drawStatic();
  } else {
    startLoop();
  }

  /* handle reduced-motion toggled at runtime */
  prefersReduced.addEventListener('change', (e) => {
    if (e.matches) { stopLoop(); drawStatic(); }
    else           { startLoop(); }
  });

}());
</script>
</body>
</html>
