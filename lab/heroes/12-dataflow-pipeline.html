<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 12 — Dataflow pipeline · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
  .hero-grid { display: grid; gap: var(--s-2xl); align-items: center; }
  @media (min-width: 880px) { .hero-grid { grid-template-columns: .9fr 1.1fr; } }
  .sub { color: var(--accent); font-weight: 600; }
  .hero h1 { margin-block: var(--s-lg) 0; }
  .hero .lead { font-size: 1.18rem; color: var(--text-muted); max-width: 44ch; margin-top: var(--s-lg); }
  .cta { display: flex; gap: var(--s-md); margin-top: var(--s-xl); flex-wrap: wrap; }

  .flow { width: 100%; height: auto; max-width: 580px; margin-inline: auto; display: block; }
  .flow .edge { fill: none; stroke: var(--border); stroke-width: 1.6; }
  .flow .edge.live { stroke: var(--accent); stroke-opacity: .6; stroke-dasharray: 5 9; stroke-linecap: round; }
  @media (prefers-reduced-motion: no-preference) { .flow .edge.live { animation: flow 1.1s linear infinite; } }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .flow .node { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
  .flow .lbl { font-family: var(--font-mono); font-size: 12.5px; fill: var(--text); }
  .flow .if  { font-family: var(--font-mono); font-size: 12.5px; fill: var(--accent); }
  .flow .core { fill: color-mix(in srgb, var(--accent) 13%, var(--panel)); stroke: var(--accent); stroke-width: 1.6; }
  .flow .core-t { font-family: var(--font-mono); font-weight: 600; fill: var(--text); font-size: 13.5px; }
  .flow .core-s { font-family: var(--font-mono); fill: var(--text-muted); font-size: 10.5px; }
  .flow .stage { font-family: var(--font-mono); font-size: 10px; fill: var(--text-dim); letter-spacing: .12em; }
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">12 · dataflow pipeline</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        <h1>One person. Team-scale output.</h1>
        <p class="lead"><span class="sub">Pre-wired. Open. Yours.</span><br>An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="cta">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>
      <div class="hero-visual">
        <svg class="flow" viewBox="0 0 500 384" role="img" aria-label="Dataflow: channels NATS, CLI, skills, API feed the roxabi-factory core, which drives the workers llmCLI, voiceCLI, imageCLI, cortex">
          <g aria-hidden="true">
            <text class="stage" x="58"  y="20" text-anchor="middle">CHANNELS</text>
            <text class="stage" x="250" y="20" text-anchor="middle">FACTORY</text>
            <text class="stage" x="442" y="20" text-anchor="middle">WORKERS</text>

            <!-- edges: channels -> core -->
            <path class="edge live" d="M110,52  C150,52  150,190 185,190"/>
            <path class="edge live" d="M110,140 C152,140 152,190 185,190"/>
            <path class="edge live" d="M110,240 C152,240 152,190 185,190"/>
            <path class="edge live" d="M110,328 C150,328 150,190 185,190"/>
            <!-- edges: core -> workers -->
            <path class="edge live" d="M315,190 C350,190 350,52  390,52"/>
            <path class="edge live" d="M315,190 C348,190 348,140 390,140"/>
            <path class="edge live" d="M315,190 C348,190 348,240 390,240"/>
            <path class="edge live" d="M315,190 C350,190 350,328 390,328"/>

            <!-- channel nodes -->
            <g><rect class="node" x="6" y="34"  width="104" height="36" rx="8"/><text class="if" x="58" y="56"  text-anchor="middle">NATS</text></g>
            <g><rect class="node" x="6" y="122" width="104" height="36" rx="8"/><text class="if" x="58" y="144" text-anchor="middle">CLI</text></g>
            <g><rect class="node" x="6" y="222" width="104" height="36" rx="8"/><text class="if" x="58" y="244" text-anchor="middle">skills</text></g>
            <g><rect class="node" x="6" y="310" width="104" height="36" rx="8"/><text class="if" x="58" y="332" text-anchor="middle">API</text></g>

            <!-- core -->
            <rect class="core" x="185" y="158" width="130" height="64" rx="12"/>
            <text class="core-t" x="250" y="186" text-anchor="middle">roxabi-factory</text>
            <text class="core-s" x="250" y="204" text-anchor="middle">agents · workers</text>

            <!-- worker nodes -->
            <g><rect class="node" x="390" y="34"  width="104" height="36" rx="8"/><text class="lbl" x="442" y="56"  text-anchor="middle">llmCLI</text></g>
            <g><rect class="node" x="390" y="122" width="104" height="36" rx="8"/><text class="lbl" x="442" y="144" text-anchor="middle">voiceCLI</text></g>
            <g><rect class="node" x="390" y="222" width="104" height="36" rx="8"/><text class="lbl" x="442" y="244" text-anchor="middle">imageCLI</text></g>
            <g><rect class="node" x="390" y="310" width="104" height="36" rx="8"/><text class="lbl" x="442" y="332" text-anchor="middle">cortex</text></g>
          </g>
        </svg>
      </div>
    </div>
  </section>
</main>
</body>
</html>
