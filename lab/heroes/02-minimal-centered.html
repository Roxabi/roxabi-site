<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 02 — Minimal · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
/* ── Ambient background ─────────────────────────────────────── */
.hero {
  justify-content: center;
  /* Faint radial amber halo from top-center */
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(240,180,41,.07) 0%, transparent 70%),
    var(--bg);
}

/* Dot grid: 1px amber dots at very low opacity */
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(240,180,41,.06) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 1;
}

/* ── Hero inner layout ──────────────────────────────────────── */
.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--s-lg);
  max-width: 720px;
  margin-inline: auto;
}

/* ── Oversized headline ─────────────────────────────────────── */
.hero-h1 {
  font-size: clamp(3rem, 8vw, 5.5rem);
  font-weight: 900;
  letter-spacing: -.04em;
  line-height: 1.04;
  text-wrap: balance;
  /* Static fallback gradient (amber → text) */
  background: linear-gradient(135deg, var(--text) 0%, var(--text) 45%, var(--accent) 60%, var(--text) 75%, var(--text) 100%);
  background-size: 250% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--text); /* non-clip fallback */
  /* Animation defined below; activated only when motion OK */
}

/* Sheen sweep — only applied via JS when reduced-motion is off */
@keyframes sheen {
  0%   { background-position: 200% center; }
  100% { background-position: -50% center; }
}

/* ── Sub-headline ───────────────────────────────────────────── */
.hero-sub {
  color: var(--accent);
  font-weight: 700;
  font-size: clamp(1rem, 2.5vw, 1.2rem);
  letter-spacing: -.01em;
  line-height: 1.3;
}

/* ── Lead copy ──────────────────────────────────────────────── */
.hero-lead {
  color: var(--text-muted);
  font-size: clamp(.95rem, 2vw, 1.1rem);
  line-height: 1.7;
  max-width: 52ch;
}

/* ── CTA row ────────────────────────────────────────────────── */
.hero-cta {
  display: flex;
  align-items: center;
  gap: var(--s-md);
  flex-wrap: wrap;
  justify-content: center;
  margin-top: var(--s-sm);
}

/* ── Separator rule under the badge ────────────────────────── */
.hero-inner > .badge { margin-bottom: calc(var(--s-sm) * -0.5); }

/* ── Thin horizontal accent rule — decorative ──────────────── */
.hero-rule {
  width: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin-top: calc(var(--s-sm) * -0.5);
  opacity: .6;
}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width: 820px) {
  .hero-inner { gap: var(--s-md); }
}

@media (max-width: 480px) {
  .hero-cta { flex-direction: column; width: 100%; }
  .hero-cta .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">02 · minimal centered</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap">
      <div class="hero-inner">
        <span class="badge"><span class="dot" aria-hidden="true"></span>AGPL-3.0 · Open by architecture</span>
        <div class="hero-rule" aria-hidden="true"></div>
        <h1 class="hero-h1">One person.<br>Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
/* Activate sheen sweep only when the user is OK with motion */
(function () {
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var h1 = document.querySelector('.hero-h1');
    if (h1) {
      h1.style.backgroundSize = '250% auto';
      h1.style.animation = 'sheen 4.5s linear 0.6s infinite';
    }
  }
}());
</script>
</body>
</html>
