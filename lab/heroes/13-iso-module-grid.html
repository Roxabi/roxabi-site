<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 13 — Iso module grid · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
  .hero-grid { display: grid; gap: var(--s-2xl); align-items: center; }
  @media (min-width: 880px) { .hero-grid { grid-template-columns: .92fr 1.08fr; } }
  .sub { color: var(--accent); font-weight: 600; }
  .hero h1 { margin-block: var(--s-lg) 0; }
  .hero .lead { font-size: 1.18rem; color: var(--text-muted); max-width: 44ch; margin-top: var(--s-lg); }
  .cta { display: flex; gap: var(--s-md); margin-top: var(--s-xl); flex-wrap: wrap; }

  #iso { width: 100%; height: auto; max-width: 560px; margin-inline: auto; display: block; }
  #iso .grid-line { stroke: var(--border); stroke-width: 1; }
  #iso .grid-line.accent { stroke: var(--accent); stroke-opacity: .18; }
  #iso .link { stroke: var(--accent); stroke-opacity: .5; stroke-width: 1.6; stroke-dasharray: 4 8; fill: none; stroke-linecap: round; }
  @media (prefers-reduced-motion: no-preference) { #iso .link { animation: pull 1.2s linear infinite; } }
  @keyframes pull { to { stroke-dashoffset: -24; } }
  #iso .mlabel { font-family: var(--font-mono); font-size: 12px; fill: var(--text-muted); }
  #iso .clabel { font-family: var(--font-mono); font-size: 11px; fill: var(--accent); letter-spacing: .04em; }
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">13 · iso module grid</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        <h1>One person. Team-scale output.</h1>
        <p class="lead"><span class="sub">Pre-wired. Open. Yours.</span><br>An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="cta">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>
      <div class="hero-visual">
        <svg id="iso" viewBox="0 0 540 420" role="img" aria-label="Isometric blueprint: the roxabi-factory core surrounded by module blocks llmCLI, voiceCLI, imageCLI, cortex, intel, idna on a grid"></svg>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var svg = document.getElementById('iso');
  var SVGNS = 'http://www.w3.org/2000/svg';
  var CX = 270, CY = 196;                 // scene centre (cubes)
  var GCX = 270, GCY = 250, TW = 30, TH = 15;  // grid origin + tile half-size
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── defs: glowing core gradient + bloom (from the logo) ──
  var defs =
    '<defs>' +
    '<radialGradient id="fbCore" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0%" stop-color="#fde68a"/><stop offset="35%" stop-color="#fbbf24"/>' +
    '<stop offset="100%" stop-color="#f0b429" stop-opacity="0.25"/></radialGradient>' +
    '<filter id="fbBloom" x="-80%" y="-80%" width="260%" height="260%">' +
    '<feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0%" stop-color="#f0b429" stop-opacity="0.35"/><stop offset="70%" stop-color="#f0b429" stop-opacity="0"/></radialGradient>' +
    '</defs>';

  function iso(gx, gy) { return [GCX + (gx - gy) * TW, GCY + (gx + gy) * TH]; }

  // ── grid plane ──
  var grid = '<g aria-hidden="true">';
  for (var g = -5; g <= 5; g++) {
    var a1 = iso(g, -5), a2 = iso(g, 5), b1 = iso(-5, g), b2 = iso(5, g);
    var cls = (g === 0) ? 'grid-line accent' : 'grid-line';
    grid += '<line class="' + cls + '" x1="' + a1[0] + '" y1="' + a1[1] + '" x2="' + a2[0] + '" y2="' + a2[1] + '"/>';
    grid += '<line class="' + cls + '" x1="' + b1[0] + '" y1="' + b1[1] + '" x2="' + b2[0] + '" y2="' + b2[1] + '"/>';
  }
  grid += '</g>';

  // ── module ring (iso-flattened hexagon around the core) ──
  var R = 150, names = ['llmCLI', 'voiceCLI', 'imageCLI', 'cortex', 'intel', 'idna'];
  var mods = names.map(function (n, k) {
    var a = (-90 + k * 60) * Math.PI / 180;
    return { x: CX + R * Math.cos(a), y: CY + R * 0.5 * Math.sin(a), s: 1.0, label: n };
  });
  var core = { x: CX, y: CY, s: 1.7, core: true, label: 'factory' };

  // ── connectors (core → each module) ──
  var links = '<g aria-hidden="true">';
  mods.forEach(function (m) {
    links += '<path class="link" d="M' + CX + ',' + CY + ' L' + m.x.toFixed(1) + ',' + m.y.toFixed(1) + '"/>';
  });
  links += '</g>';

  // ── cube builder (faithful to the logo iso block, centred at 32,32) ──
  function cube(o) {
    var t = 'translate(' + o.x.toFixed(1) + ',' + o.y.toFixed(1) + ') scale(' + o.s + ') translate(-32,-32)';
    var id = o.core ? ' id="isoCore"' : '';
    var s = '<g' + id + ' transform="' + t + '">';
    if (o.core) s += '<ellipse cx="32" cy="34" rx="30" ry="20" fill="url(#coreGlow)"/>';
    // faces
    s += '<polygon points="12,22 32,32 32,52 12,42" fill="#11161d"/>';
    s += '<polygon points="52,22 52,42 32,52 32,32" fill="#171e27"/>';
    s += '<polygon points="32,12 52,22 32,32 12,22" fill="#1c2431"/>';
    if (o.core) {
      s += '<ellipse cx="32" cy="22" rx="9" ry="5" fill="url(#fbCore)" filter="url(#fbBloom)" opacity="0.9"/>';
      s += '<polygon points="32,16 44,22 32,28 20,22" fill="url(#fbCore)" stroke="#fbbf24" stroke-width="0.8" filter="url(#fbBloom)"/>';
    } else {
      s += '<circle cx="32" cy="22" r="2" fill="#f0b429" opacity="0.8"/>';
    }
    // amber edges
    var ew = o.core ? 1.5 : 1.1, eop = o.core ? 1 : 0.5;
    s += '<path d="M32,12 52,22 52,42 32,52 12,42 12,22Z" fill="none" stroke="#f0b429" stroke-width="' + ew + '" stroke-opacity="' + eop + '" stroke-linejoin="round"/>';
    s += '</g>';
    return s;
  }

  // paint cubes back-to-front (smaller screen-y first)
  var all = mods.concat([core]).slice().sort(function (a, b) { return a.y - b.y; });
  var cubes = '<g aria-hidden="true">' + all.map(cube).join('') + '</g>';

  // labels (on top, always legible)
  var labels = '<g aria-hidden="true">';
  mods.forEach(function (m) {
    labels += '<text class="mlabel" x="' + m.x.toFixed(1) + '" y="' + (m.y + 34).toFixed(1) + '" text-anchor="middle">' + m.label + '</text>';
  });
  labels += '<text class="clabel" x="' + CX + '" y="' + (CY + 44) + '" text-anchor="middle">roxabi-factory</text>';
  labels += '</g>';

  svg.innerHTML = defs + grid + links + cubes + labels;

  // ── core float (rAF, guarded) ──
  var coreEl = document.getElementById('isoCore');
  var baseT = coreEl.getAttribute('transform');
  var running = true, raf = 0;
  function frame(t) {
    if (!running) return;
    var dy = Math.sin(t / 900) * 4;
    coreEl.setAttribute('transform', baseT + ' translate(0,' + dy.toFixed(2) + ')');
    raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden && !reduce;
    if (running && !document.hidden) raf = requestAnimationFrame(frame);
  });
  if (!reduce) raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
