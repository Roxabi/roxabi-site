<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 23 — Block + channel ports · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
/* ── Hero layout ────────────────────────────────────────────── */
.hero {
  padding-block: var(--s-2xl);
}
.hero .wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: var(--s-2xl);
  min-height: calc(100svh - 60px);
}

/* ── Copy column ────────────────────────────────────────────── */
.hero-copy {
  display: flex;
  flex-direction: column;
  gap: var(--s-lg);
  position: relative;
  z-index: 3;
}
.hero-copy h1 {
  color: var(--text);
}
.hero-sub {
  color: var(--accent);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: .01em;
  line-height: 1.3;
}
.hero-lead {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.65;
  max-width: 38ch;
}
.hero-ctas {
  display: flex;
  gap: var(--s-md);
  flex-wrap: wrap;
  align-items: center;
}
@media (min-width: 820px) {
  .hero-copy {
    padding-bottom: var(--s-xl);
  }
}

/* ── Visual column ──────────────────────────────────────────── */
.hero-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: calc(-1 * var(--s-lg));
}

/* Radial amber spotlight behind the block */
.hero-spotlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.hero-spotlight::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -55%;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(
    circle at center,
    rgba(240,180,41,.18) 0%,
    rgba(240,180,41,.10) 25%,
    rgba(240,180,41,.03) 55%,
    transparent 70%
  );
}

/* Outer glow ring */
.hero-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 45%,
    rgba(240,180,41,.12) 0%,
    transparent 65%
  );
  pointer-events: none;
  z-index: 1;
}

/* The scene SVG wrapper — block + port nodes in one coordinate space */
.hero-block {
  position: relative;
  z-index: 2;
  width: min(460px, 90vw);
  height: min(460px, 90vw);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: blockFloat 6s ease-in-out infinite;
  will-change: transform;
}
.hero-block svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

@keyframes blockFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33%       { transform: translateY(-10px) rotate(.4deg); }
  66%       { transform: translateY(-4px) rotate(-.3deg); }
}

/* ── Port connector edges (amber dashes flowing inward) ───── */
/* Animates stroke-dashoffset so dashes flow INWARD (toward block) */
.port-edge {
  fill: none;
  stroke: #f0b429;
  stroke-opacity: .65;
  stroke-width: 1.6;
  stroke-dasharray: 5 9;
  stroke-linecap: round;
}
@media (prefers-reduced-motion: no-preference) {
  .port-edge { animation: portFlow 1.1s linear infinite; }
}
@keyframes portFlow {
  /* positive dashoffset = dashes move toward origin = inward toward block */
  from { stroke-dashoffset: 28; }
  to   { stroke-dashoffset: 0; }
}

/* ── Port node labels ───────────────────────────────────────── */
.port-node {
  fill: var(--panel, #0d1620);
  stroke: #f0b429;
  stroke-width: 1.4;
}
.port-label {
  font-family: var(--font-mono, monospace);
  font-size: 11.5px;
  font-weight: 600;
  fill: #f0b429;
  dominant-baseline: middle;
  text-anchor: middle;
  letter-spacing: .03em;
}

/* ── Decorative grid lines ───────────────────────────────────── */
.hero-grid {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .15;
  overflow: hidden;
}
.hero-grid svg {
  width: 100%;
  height: 100%;
}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width: 820px) {
  .hero .wrap {
    grid-template-columns: 1fr;
    gap: var(--s-xl);
    min-height: unset;
    padding-block: var(--s-2xl);
  }
  .hero-copy { order: 1; }
  .hero-visual {
    order: 0;
    margin-right: 0;
    justify-content: center;
  }
  .hero-block {
    width: min(320px, 88vw);
    height: min(320px, 88vw);
  }
  .hero-lead { max-width: none; }
}
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">23 · block + channel ports</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap">

      <!-- Copy -->
      <div class="hero-copy">
        <div>
          <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        </div>
        <h1>One person.<br>Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>

      <!-- Visual: factory block with 4 channel ports plugging in -->
      <div class="hero-visual" aria-hidden="true">

        <!-- Ambient spotlight wash -->
        <div class="hero-spotlight"></div>
        <div class="hero-glow"></div>

        <!-- Decorative perspective grid behind block -->
        <div class="hero-grid">
          <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="gridFade" cx="50%" cy="40%" r="55%">
                <stop offset="0%" stop-color="#f0b429" stop-opacity="1"/>
                <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <line x1="0" y1="220" x2="400" y2="220" stroke="url(#gridFade)" stroke-width=".8"/>
            <line x1="0" y1="250" x2="400" y2="250" stroke="url(#gridFade)" stroke-width=".6"/>
            <line x1="0" y1="280" x2="400" y2="280" stroke="url(#gridFade)" stroke-width=".5"/>
            <line x1="0" y1="310" x2="400" y2="310" stroke="url(#gridFade)" stroke-width=".4"/>
            <line x1="0" y1="340" x2="400" y2="340" stroke="url(#gridFade)" stroke-width=".3"/>
            <line x1="200" y1="180" x2="0"   y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="66"  y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="133" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="200" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="267" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="333" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="400" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
          </svg>
        </div>

        <!--
          Scene SVG: 500×500 viewBox
          Block centered at (250,250), same proportions as 06 but translated.
          Original block vertices (06, 320×320 viewBox):
            top:        160, 36
            left:        86, 81
            right:      234, 81
            left-bot:    86,171
            right-bot:  234,171
            bottom:     160,216
            center-mid: 160,126
          Offset to center on 500×500 with a little upward shift:
            +90 x, +60 y  (250-160=90, 310-250=60... use +90x,+55y)
          New vertices:
            top:        250, 91
            left:       176,136
            right:      324,136
            left-bot:   176,226
            right-bot:  324,226
            bottom:     250,271
            center-mid: 250,181

          Port attachment points (on cube face edges/corners):
            NATS  → left face mid-left edge:  176, 181  → port at: 72, 155
            CLI   → top-left edge mid:        213, 113  → port at: 120,  58
            skills→ top-right edge mid:       287, 113  → port at: 380,  58
            API   → right face mid-right edge:324, 181  → port at: 428, 155
        -->
        <div class="hero-block">
          <svg viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg"
               role="img" aria-label="Roxabi factory block with NATS, CLI, skills, and API channel ports plugging in">
            <defs>
              <!-- Core aperture gradient -->
              <radialGradient id="hCore23" cx="50%" cy="50%" r="50%">
                <stop offset="0%"  stop-color="#fff7d6"/>
                <stop offset="30%" stop-color="#fde68a"/>
                <stop offset="70%" stop-color="#f0b429"/>
                <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
              </radialGradient>
              <!-- Left face -->
              <linearGradient id="hLeft23" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"  stop-color="#0b1016"/>
                <stop offset="100%" stop-color="#11181f"/>
              </linearGradient>
              <!-- Right face -->
              <linearGradient id="hRight23" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"  stop-color="#151c24"/>
                <stop offset="100%" stop-color="#1b2330"/>
              </linearGradient>
              <!-- Top face -->
              <linearGradient id="hTop23" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%"  stop-color="#1e2a38"/>
                <stop offset="100%" stop-color="#19222e"/>
              </linearGradient>
              <!-- Bloom filter -->
              <filter id="hBloom23" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Ambient glow -->
              <filter id="hAmbient23" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="18" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Edge bloom -->
              <filter id="hEdge23" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Bevel -->
              <filter id="hBevel23" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur stdDeviation="1.2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Port node glow -->
              <filter id="portGlow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- ── Iso block centered ~250,181 ─────────────────────────
                 top:250,91  left:176,136  right:324,136
                 left-bot:176,226  right-bot:324,226  bottom:250,271
                 center-mid:250,181
            ─────────────────────────────────────────────────────────── -->

            <!-- Ambient glow ghost -->
            <polygon points="250,91 324,136 324,226 250,271 176,226 176,136"
              fill="none" stroke="#f0b429" stroke-width="24" opacity=".06"
              filter="url(#hAmbient23)"/>

            <!-- Three cube faces -->
            <polygon points="176,136 250,181 250,271 176,226" fill="url(#hLeft23)"/>
            <polygon points="324,136 324,226 250,271 250,181" fill="url(#hRight23)"/>
            <polygon points="250,91  324,136 250,181 176,136" fill="url(#hTop23)"/>

            <!-- Top face inner bevel -->
            <polygon points="250,91 324,136 250,181 176,136"
              fill="none" stroke="#263040" stroke-width="1" opacity=".9"/>

            <!-- Edge highlights -->
            <line x1="176" y1="136" x2="250" y2="91"
              stroke="#2e3e52" stroke-width="1.5" opacity=".8"/>
            <line x1="250" y1="91" x2="324" y2="136"
              stroke="#243040" stroke-width="1.5" opacity=".6"/>

            <!-- Amber outline -->
            <polygon points="250,91 324,136 324,226 250,271 176,226 176,136"
              fill="none" stroke="#f0b429" stroke-width="2.5" stroke-linejoin="round"
              filter="url(#hEdge23)" opacity=".9"/>

            <!-- Internal structure lines -->
            <line x1="176" y1="136" x2="250" y2="181"
              stroke="#f0b429" stroke-width="1.6" opacity=".6" filter="url(#hEdge23)"/>
            <line x1="324" y1="136" x2="250" y2="181"
              stroke="#f0b429" stroke-width="1.6" opacity=".5" filter="url(#hEdge23)"/>
            <line x1="250" y1="181" x2="250" y2="271"
              stroke="#f0b429" stroke-width="1.6" opacity=".5" filter="url(#hEdge23)"/>

            <!-- Open top aperture: ambient halo ellipse -->
            <ellipse cx="250" cy="136" rx="38" ry="21"
              fill="url(#hCore23)" filter="url(#hAmbient23)" opacity=".7"/>

            <!-- Open top aperture: glowing diamond -->
            <polygon points="250,109 292,136 250,163 208,136"
              fill="url(#hCore23)"
              stroke="#fbbf24" stroke-width="1.5"
              filter="url(#hBloom23)" opacity=".95"/>

            <!-- Corner dots -->
            <circle cx="250" cy="91"  r="3.5" fill="#f0b429" opacity=".5" filter="url(#hBevel23)"/>
            <circle cx="176" cy="136" r="3"   fill="#f0b429" opacity=".35" filter="url(#hBevel23)"/>
            <circle cx="324" cy="136" r="3"   fill="#f0b429" opacity=".35" filter="url(#hBevel23)"/>
            <circle cx="250" cy="181" r="3"   fill="#f0b429" opacity=".3"  filter="url(#hBevel23)"/>

            <!-- ── Channel port nodes + inward-flowing dash connectors ──
                 4 ports placed near each face of the block:
                   NATS   → left face  → from (68,181)  to attach (176,181)
                   CLI    → top-left   → from (108, 68) to attach (213,113)
                   skills → top-right  → from (392, 68) to attach (287,113)
                   API    → right face → from (432,181)  to attach (324,181)
            ────────────────────────────────────────────────────────────── -->

            <!-- NATS: left face, attaches to left-face midpoint -->
            <path class="port-edge" d="M108,181 L176,181"/>
            <rect class="port-node" x="34" y="163" width="74" height="36" rx="8" filter="url(#portGlow)"/>
            <text class="port-label" x="71" y="181">NATS</text>

            <!-- CLI: top-left edge, attaches to mid-point of top-left edge -->
            <path class="port-edge" d="M145,80 L213,113"/>
            <rect class="port-node" x="82" y="58" width="62" height="32" rx="8" filter="url(#portGlow)"/>
            <text class="port-label" x="113" y="74">CLI</text>

            <!-- skills: top-right edge, attaches to mid-point of top-right edge -->
            <path class="port-edge" d="M355,80 L287,113"/>
            <rect class="port-node" x="343" y="58" width="74" height="32" rx="8" filter="url(#portGlow)"/>
            <text class="port-label" x="380" y="74">skills</text>

            <!-- API: right face, attaches to right-face midpoint -->
            <path class="port-edge" d="M392,181 L324,181"/>
            <rect class="port-node" x="392" y="163" width="68" height="36" rx="8" filter="url(#portGlow)"/>
            <text class="port-label" x="426" y="181">API</text>

          </svg>
        </div>
      </div>

    </div>
  </section>
</main>
<script>
/* Guard float animation against reduced-motion preference */
(function () {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  function applyMotion(e) {
    const block = document.querySelector('.hero-block');
    if (!block) return;
    block.style.animation = e.matches ? 'none' : '';
  }
  applyMotion(mq);
  mq.addEventListener('change', applyMotion);
  /* Note: port-edge dash animation is guarded by CSS @media prefers-reduced-motion
     in the <style> block — no JS needed for that path. */
})();
</script>
</body>
</html>
