<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 06 — Geometric · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
/* ── Hero layout ────────────────────────────────────────────── */
.hero {
  padding-block: var(--s-2xl);
}
.hero .wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: var(--s-2xl);
  min-height: calc(100svh - 60px);
}

/* ── Copy column ────────────────────────────────────────────── */
.hero-copy {
  display: flex;
  flex-direction: column;
  gap: var(--s-lg);
  position: relative;
  z-index: 3;
}
.hero-copy h1 {
  color: var(--text);
}
.hero-sub {
  color: var(--accent);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: .01em;
  line-height: 1.3;
}
.hero-lead {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.65;
  max-width: 38ch;
}
.hero-ctas {
  display: flex;
  gap: var(--s-md);
  flex-wrap: wrap;
  align-items: center;
}
/* slight diagonal tilt on the copy column for energy */
@media (min-width: 820px) {
  .hero-copy {
    padding-bottom: var(--s-xl);
  }
}

/* ── Visual column ──────────────────────────────────────────── */
.hero-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  /* extend slightly off-grid for asymmetry */
  margin-right: calc(-1 * var(--s-lg));
}

/* Radial amber spotlight behind the block */
.hero-spotlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.hero-spotlight::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -55%;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(
    circle at center,
    rgba(240,180,41,.18) 0%,
    rgba(240,180,41,.10) 25%,
    rgba(240,180,41,.03) 55%,
    transparent 70%
  );
}

/* Outer glow ring — tight amber halo on block perimeter */
.hero-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 45%,
    rgba(240,180,41,.12) 0%,
    transparent 65%
  );
  pointer-events: none;
  z-index: 1;
}

/* The animated block SVG wrapper */
.hero-block {
  position: relative;
  z-index: 2;
  width: min(380px, 90vw);
  height: min(380px, 90vw);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: blockFloat 6s ease-in-out infinite;
  will-change: transform;
}
.hero-block svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 32px rgba(240,180,41,.28)) drop-shadow(0 0 8px rgba(240,180,41,.18));
}

@keyframes blockFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33%       { transform: translateY(-10px) rotate(.4deg); }
  66%       { transform: translateY(-4px) rotate(-.3deg); }
}

/* ── Decorative grid lines (subtle perspective floor) ───────── */
.hero-grid {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .18;
  overflow: hidden;
}
.hero-grid svg {
  width: 100%;
  height: 100%;
}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width: 820px) {
  .hero .wrap {
    grid-template-columns: 1fr;
    gap: var(--s-xl);
    min-height: unset;
    padding-block: var(--s-2xl);
  }
  .hero-copy { order: 1; }
  .hero-visual {
    order: 0;
    margin-right: 0;
    justify-content: center;
  }
  .hero-block {
    width: min(280px, 80vw);
    height: min(280px, 80vw);
  }
  .hero-lead { max-width: none; }
}
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">06 · geometric spotlight</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap">

      <!-- Copy -->
      <div class="hero-copy">
        <div>
          <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        </div>
        <h1>One person.<br>Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>

      <!-- Visual: geometric block centerpiece -->
      <div class="hero-visual" aria-hidden="true">

        <!-- Ambient spotlight wash -->
        <div class="hero-spotlight"></div>
        <div class="hero-glow"></div>

        <!-- Decorative perspective grid behind block -->
        <div class="hero-grid">
          <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <!-- Vertical lines converging to a vanishing point at top-center -->
            <defs>
              <radialGradient id="gridFade" cx="50%" cy="40%" r="55%">
                <stop offset="0%" stop-color="#f0b429" stop-opacity="1"/>
                <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <!-- Horizontal bands -->
            <line x1="0" y1="220" x2="400" y2="220" stroke="url(#gridFade)" stroke-width=".8"/>
            <line x1="0" y1="250" x2="400" y2="250" stroke="url(#gridFade)" stroke-width=".6"/>
            <line x1="0" y1="280" x2="400" y2="280" stroke="url(#gridFade)" stroke-width=".5"/>
            <line x1="0" y1="310" x2="400" y2="310" stroke="url(#gridFade)" stroke-width=".4"/>
            <line x1="0" y1="340" x2="400" y2="340" stroke="url(#gridFade)" stroke-width=".3"/>
            <!-- Radial spokes from center-top vanish -->
            <line x1="200" y1="180" x2="0"   y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="66"  y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="133" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="200" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="267" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="333" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
            <line x1="200" y1="180" x2="400" y2="400" stroke="url(#gridFade)" stroke-width=".7"/>
          </svg>
        </div>

        <!-- Enlarged foundation-block (isometric extruded cube, inline SVG) -->
        <div class="hero-block">
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
            <defs>
              <!-- Core aperture gradient — bright warm amber center -->
              <radialGradient id="hCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%"  stop-color="#fff7d6"/>
                <stop offset="30%" stop-color="#fde68a"/>
                <stop offset="70%" stop-color="#f0b429"/>
                <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
              </radialGradient>
              <!-- Left face: dark slate -->
              <linearGradient id="hLeft" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"  stop-color="#0b1016"/>
                <stop offset="100%" stop-color="#11181f"/>
              </linearGradient>
              <!-- Right face: mid slate -->
              <linearGradient id="hRight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"  stop-color="#151c24"/>
                <stop offset="100%" stop-color="#1b2330"/>
              </linearGradient>
              <!-- Top face: lighter slate -->
              <linearGradient id="hTop" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%"  stop-color="#1e2a38"/>
                <stop offset="100%" stop-color="#19222e"/>
              </linearGradient>
              <!-- Bloom filter for aperture glow -->
              <filter id="hBloom" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Big ambient glow behind block -->
              <filter id="hAmbient" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="18" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Crisp edge bloom -->
              <filter id="hEdge" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <!-- Bevel highlight on top-left edge -->
              <filter id="hBevel" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur stdDeviation="1.2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Isometric cube — vertices (scaled ~4× the 64px logo, centered on 320×320)
                 Logo points (in logo's 60-unit coordinate space, translated +4y):
                   top-apex:    32,8  → scaled ×4.5 center-offset: 160, 36
                   left:        12,18 →  54, 81   right: 52,18 → 234, 81
                   left-mid:    12,38 →  54, 171  right-mid: 52,38 → 234, 171
                   bottom:      32,48 → 160, 216
                   center-mid:  32,28 → 160, 126
                 Scale factor: 320/64 = 5, but shifted for visual center → use ×4.5 with +y bias
            -->

            <!-- Ambient glow ghost (large blurred amber cube outline, sits behind) -->
            <polygon points="160,36 234,81 234,171 160,216 86,171 86,81"
              fill="none" stroke="#f0b429" stroke-width="24" opacity=".06"
              filter="url(#hAmbient)"/>

            <!-- Three cube faces -->
            <polygon points="86,81  160,126 160,216 86,171"  fill="url(#hLeft)"/>
            <polygon points="234,81 234,171 160,216 160,126" fill="url(#hRight)"/>
            <polygon points="160,36 234,81  160,126 86,81"   fill="url(#hTop)"/>

            <!-- Top face inner bevel — subtle lighter rim on top face edges -->
            <polygon points="160,36 234,81 160,126 86,81"
              fill="none" stroke="#263040" stroke-width="1" opacity=".9"/>

            <!-- Face edge bevels — each edge gets a thin lighter highlight line -->
            <!-- Top-left outer edge highlight (bright rim) -->
            <line x1="86" y1="81" x2="160" y2="36"
              stroke="#2e3e52" stroke-width="1.5" opacity=".8"/>
            <!-- Top-right outer edge highlight -->
            <line x1="160" y1="36" x2="234" y2="81"
              stroke="#243040" stroke-width="1.5" opacity=".6"/>

            <!-- Amber outline edges (entire cube silhouette) -->
            <polygon points="160,36 234,81 234,171 160,216 86,171 86,81"
              fill="none" stroke="#f0b429" stroke-width="2.5" stroke-linejoin="round"
              filter="url(#hEdge)" opacity=".9"/>

            <!-- Internal structure lines (center pillar) -->
            <line x1="86"  y1="81"  x2="160" y2="126"
              stroke="#f0b429" stroke-width="1.6" stroke-linejoin="round"
              opacity=".6" filter="url(#hEdge)"/>
            <line x1="234" y1="81"  x2="160" y2="126"
              stroke="#f0b429" stroke-width="1.6"
              opacity=".5" filter="url(#hEdge)"/>
            <line x1="160" y1="126" x2="160" y2="216"
              stroke="#f0b429" stroke-width="1.6"
              opacity=".5" filter="url(#hEdge)"/>

            <!-- Open top aperture: ambient halo ellipse -->
            <ellipse cx="160" cy="81" rx="38" ry="21"
              fill="url(#hCore)" filter="url(#hAmbient)" opacity=".7"/>

            <!-- Open top aperture: glowing diamond (top face inset) -->
            <polygon points="160,54 202,81 160,108 118,81"
              fill="url(#hCore)"
              stroke="#fbbf24" stroke-width="1.5"
              filter="url(#hBloom)" opacity=".95"/>

            <!-- Top-face corner dots — depth accents -->
            <circle cx="160" cy="36"  r="3.5" fill="#f0b429" opacity=".5" filter="url(#hBevel)"/>
            <circle cx="86"  cy="81"  r="3"   fill="#f0b429" opacity=".35" filter="url(#hBevel)"/>
            <circle cx="234" cy="81"  r="3"   fill="#f0b429" opacity=".35" filter="url(#hBevel)"/>
            <circle cx="160" cy="126" r="3"   fill="#f0b429" opacity=".3"  filter="url(#hBevel)"/>

          </svg>
        </div>
      </div>

    </div>
  </section>
</main>
<script>
/* Guard animation against reduced-motion preference */
(function () {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  function applyMotion(e) {
    const block = document.querySelector('.hero-block');
    if (!block) return;
    if (e.matches) {
      block.style.animation = 'none';
    } else {
      block.style.animation = '';
    }
  }
  applyMotion(mq);
  mq.addEventListener('change', applyMotion);
})();
</script>
</body>
</html>
