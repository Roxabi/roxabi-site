<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 17b — Iso grid · absorbed into core · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
  .hero-grid { display: grid; gap: var(--s-2xl); align-items: center; }
  @media (min-width: 880px) { .hero-grid { grid-template-columns: .78fr 1.22fr; } }

  .hero-copy { display: flex; flex-direction: column; gap: var(--s-lg); padding-block: var(--s-2xl); }
  .hero-copy .badge { align-self: flex-start; }
  .hero h1 { margin: 0; }
  .hero-sub { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: -.01em; }
  .hero-lead { font-size: 1.075rem; line-height: 1.65; color: var(--text-muted); max-width: 42ch; }
  .hero-ctas { display: flex; gap: var(--s-md); flex-wrap: wrap; align-items: center; padding-top: var(--s-xs); }

  #iso { width: 100%; height: auto; max-width: 720px; margin-inline: auto; display: block; }
  #iso .grid-line { stroke: var(--border); stroke-width: 1; }
  #iso .grid-line.accent { stroke: var(--accent); stroke-opacity: .18; }
  #iso .link { stroke: var(--border); stroke-opacity: .55; stroke-width: 1.2; fill: none; stroke-linecap: round; }
  #iso .pulse { fill: none; stroke: var(--accent); stroke-width: 1.4; }
  #iso .mlabel { font-family: var(--font-mono); font-size: 12px; fill: var(--text-muted); }
  #iso .clabel { font-family: var(--font-mono); font-size: 11px; fill: var(--accent); letter-spacing: .04em; }

  @media (max-width: 820px) {
    .hero-grid { gap: var(--s-xl); }
    .hero-copy { padding-block: var(--s-xl); }
    .hero-lead { max-width: 100%; }
  }
  @media (max-width: 480px) {
    .hero h1 { font-size: clamp(2rem, 10vw, 2.75rem); }
    .hero-ctas { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">17b · iso grid · absorbed into core</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        <h1>One person. Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>
      <div class="hero-visual">
        <svg id="iso" viewBox="0 0 540 420" role="img"
          aria-label="Isometric blueprint: an enlarged roxabi-factory core surrounded by module blocks llmCLI, voiceCLI, imageCLI, cortex, intel, idna; dense amber dataflow particles stream behind the cubes and are absorbed into the pulsing core"></svg>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var svg    = document.getElementById('iso');
  var SVGNS  = 'http://www.w3.org/2000/svg';
  var CX = 270, CY = 196;
  var GCX = 270, GCY = 250, TW = 30, TH = 15;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── tunables (bigger core, denser + faster flow) ──
  var R = 150, CORE_S = 1.9, DOTS_PER_EDGE = 4, DOT_R = 3.2, BASE_SPEED = 0.0030;
  var CORE_HW = 38, CORE_HH = 38, MOD_HW = 18, MOD_HH = 19;
  var DOT_FILL = '#fbbf24';

  var defs =
    '<defs>' +
    '<radialGradient id="fbCore" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0%" stop-color="#fde68a"/><stop offset="35%" stop-color="#fbbf24"/>' +
    '<stop offset="100%" stop-color="#f0b429" stop-opacity="0.25"/></radialGradient>' +
    '<filter id="fbBloom" x="-80%" y="-80%" width="260%" height="260%">' +
    '<feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0%" stop-color="#f0b429" stop-opacity="0.35"/><stop offset="70%" stop-color="#f0b429" stop-opacity="0"/></radialGradient>' +
    '</defs>';

  function iso(gx, gy) { return [GCX + (gx - gy) * TW, GCY + (gx + gy) * TH]; }

  var grid = '<g aria-hidden="true">';
  for (var g = -5; g <= 5; g++) {
    var a1 = iso(g, -5), a2 = iso(g, 5), b1 = iso(-5, g), b2 = iso(5, g);
    var cls = (g === 0) ? 'grid-line accent' : 'grid-line';
    grid += '<line class="' + cls + '" x1="' + a1[0] + '" y1="' + a1[1] + '" x2="' + a2[0] + '" y2="' + a2[1] + '"/>';
    grid += '<line class="' + cls + '" x1="' + b1[0] + '" y1="' + b1[1] + '" x2="' + b2[0] + '" y2="' + b2[1] + '"/>';
  }
  grid += '</g>';

  var names = ['llmCLI', 'voiceCLI', 'imageCLI', 'cortex', 'intel', 'idna'];
  var mods  = names.map(function (n, k) {
    var a = (-90 + k * 60) * Math.PI / 180;
    return { x: CX + R * Math.cos(a), y: CY + R * 0.5 * Math.sin(a), s: 1.0, label: n };
  });
  var core = { x: CX, y: CY, s: CORE_S, core: true, label: 'factory' };

  var links = '<g aria-hidden="true">';
  mods.forEach(function (m) {
    links += '<path class="link" d="M' + CX + ',' + CY + ' L' + m.x.toFixed(1) + ',' + m.y.toFixed(1) + '"/>';
  });
  links += '</g>';

  function cube(o) {
    var t = 'translate(' + o.x.toFixed(1) + ',' + o.y.toFixed(1) + ') scale(' + o.s + ') translate(-32,-32)';
    var id = o.core ? ' id="isoCore"' : '';
    var s = '<g' + id + ' transform="' + t + '">';
    if (o.core) s += '<ellipse cx="32" cy="34" rx="30" ry="20" fill="url(#coreGlow)"/>';
    s += '<polygon points="12,22 32,32 32,52 12,42" fill="#11161d"/>';
    s += '<polygon points="52,22 52,42 32,52 32,32" fill="#171e27"/>';
    s += '<polygon points="32,12 52,22 32,32 12,22" fill="#1c2431"/>';
    if (o.core) {
      s += '<ellipse cx="32" cy="22" rx="9" ry="5" fill="url(#fbCore)" filter="url(#fbBloom)" opacity="0.9"/>';
      s += '<polygon points="32,16 44,22 32,28 20,22" fill="url(#fbCore)" stroke="#fbbf24" stroke-width="0.8" filter="url(#fbBloom)"/>';
    } else {
      s += '<circle cx="32" cy="22" r="2" fill="#f0b429" opacity="0.8"/>';
    }
    var ew = o.core ? 1.5 : 1.1, eop = o.core ? 1 : 0.5;
    s += '<path d="M32,12 52,22 52,42 32,52 12,42 12,22Z" fill="none" stroke="#f0b429" stroke-width="' + ew + '" stroke-opacity="' + eop + '" stroke-linejoin="round"/>';
    s += '</g>';
    return s;
  }

  var all   = mods.concat([core]).slice().sort(function (a, b) { return a.y - b.y; });
  var cubes = '<g id="cubesG" aria-hidden="true">' + all.map(cube).join('') + '</g>';

  var labels = '<g id="labelsG" aria-hidden="true">';
  mods.forEach(function (m) {
    labels += '<text class="mlabel" x="' + m.x.toFixed(1) + '" y="' + (m.y + 36).toFixed(1) + '" text-anchor="middle">' + m.label + '</text>';
  });
  labels += '<text class="clabel" x="' + CX + '" y="' + (CY + 48) + '" text-anchor="middle">roxabi-factory</text>';
  labels += '</g>';

  // paint order: defs · grid · links · BACK · cubes · pulses · FRONT · labels
  svg.innerHTML = defs + grid + links + cubes + labels;
  var cubesG  = svg.querySelector('#cubesG');
  var labelsG = svg.querySelector('#labelsG');
  var backLayer  = document.createElementNS(SVGNS, 'g'); backLayer.setAttribute('aria-hidden', 'true');
  var pulseLayer = document.createElementNS(SVGNS, 'g'); pulseLayer.setAttribute('aria-hidden', 'true');
  var frontLayer = document.createElementNS(SVGNS, 'g'); frontLayer.setAttribute('aria-hidden', 'true');
  svg.insertBefore(backLayer, cubesG);
  svg.insertBefore(pulseLayer, labelsG);
  svg.insertBefore(frontLayer, labelsG);

  // absorption pulse rings emanating from the core
  var pulses = [];
  for (var k = 0; k < 2; k++) {
    var pr = document.createElementNS(SVGNS, 'circle');
    pr.setAttribute('class', 'pulse');
    pr.setAttribute('cx', CX);
    pr.setAttribute('cy', CY);
    pulseLayer.appendChild(pr);
    pulses.push(pr);
  }

  function diamond(dx, dy, hw, hh) { return Math.abs(dx) / hw + Math.abs(dy) / hh <= 1; }
  function occluded(p, px, py, coreY) {
    if (py <= coreY    && diamond(px - CX,      py - coreY,   CORE_HW, CORE_HH)) return true;
    if (py <= p.mod.y  && diamond(px - p.mod.x, py - p.mod.y, MOD_HW,  MOD_HH))  return true;
    return false;
  }

  var particles = [];
  mods.forEach(function (mod, idx) {
    for (var j = 0; j < DOTS_PER_EDGE; j++) {
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('r', DOT_R);
      c.setAttribute('fill', DOT_FILL);
      frontLayer.appendChild(c);
      particles.push({ mod: mod, t: j / DOTS_PER_EDGE, speed: BASE_SPEED + j * 0.0004 + idx * 0.0001, el: c });
    }
  });

  function setLayer(p, back) {
    var tgt = back ? backLayer : frontLayer;
    if (p.el.parentNode !== tgt) tgt.appendChild(p.el);
  }

  var coreEl = document.getElementById('isoCore');
  var baseT  = coreEl.getAttribute('transform');

  if (reduce) {
    particles.forEach(function (p, i) {
      var t  = 0.38 + 0.16 * (i % 4);
      var px = p.mod.x + (CX - p.mod.x) * t;
      var py = p.mod.y + (CY - p.mod.y) * t;
      setLayer(p, occluded(p, px, py, CY));
      p.el.setAttribute('cx', px.toFixed(1));
      p.el.setAttribute('cy', py.toFixed(1));
      p.el.setAttribute('opacity', '0.75');
    });
    pulses.forEach(function (pr) { pr.setAttribute('r', '14'); pr.setAttribute('opacity', '0.22'); });
    return;
  }

  var running = true, raf = 0, PULSE_T = 2600;
  function frame(now) {
    if (!running) return;
    var dy = Math.sin(now / 900) * 4;
    coreEl.setAttribute('transform', baseT + ' translate(0,' + dy.toFixed(2) + ')');
    var coreY = CY + dy;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.t += p.speed; if (p.t >= 1) p.t -= 1;
      var px = p.mod.x + (CX - p.mod.x) * p.t;
      var py = p.mod.y + (CY - p.mod.y) * p.t;
      setLayer(p, occluded(p, px, py, coreY));
      var fadeIn = Math.min(p.t * 6, 1);
      p.el.setAttribute('cx', px.toFixed(1));
      p.el.setAttribute('cy', py.toFixed(1));
      p.el.setAttribute('opacity', (0.92 * fadeIn).toFixed(2));
    }

    for (var q = 0; q < pulses.length; q++) {
      var ph = ((now + q * (PULSE_T / 2)) % PULSE_T) / PULSE_T;  // 0..1
      pulses[q].setAttribute('cy', coreY.toFixed(1));
      pulses[q].setAttribute('r', (8 + ph * 40).toFixed(1));
      pulses[q].setAttribute('opacity', (0.34 * (1 - ph)).toFixed(2));
    }

    raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden && !reduce;
    if (running) raf = requestAnimationFrame(frame);
  });
  if (!reduce) raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
