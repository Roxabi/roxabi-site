<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 17a — Iso grid · depth occlusion · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
  .hero .wrap { max-width: 1280px; }
  .hero-grid { display: grid; gap: 0; align-items: center; }
  @media (min-width: 880px) { .hero-grid { grid-template-columns: .8fr 1.2fr; } }

  .hero-copy { display: flex; flex-direction: column; gap: var(--s-lg); padding-block: var(--s-2xl); }
  .hero-copy .badge { align-self: flex-start; }
  /* sized so "Team-scale output." holds on one line → headline stays 2 lines */
  .hero h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1.07; text-wrap: balance; }
  .hero-sub { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: -.01em; }
  .hero-lead { font-size: 1.075rem; line-height: 1.65; color: var(--text-muted); max-width: 42ch; }
  .hero-ctas { display: flex; gap: var(--s-md); flex-wrap: wrap; align-items: center; padding-top: var(--s-xs); }

  #iso { width: 100%; height: auto; max-width: 880px; margin-inline: auto; display: block; }
  #iso .grid-line { stroke: var(--border); stroke-width: 1; }
  #iso .grid-line.accent { stroke: var(--accent); stroke-opacity: .18; }
  #iso .link { stroke: var(--border); stroke-opacity: .55; stroke-width: 1.2; fill: none; stroke-linecap: round; }
  #iso .mlabel { font-family: var(--font-mono); font-size: 12px; fill: var(--text-muted); }
  #iso .clabel { font-family: var(--font-mono); font-size: 11px; fill: var(--accent); letter-spacing: .04em; }

  @media (max-width: 820px) {
    .hero-grid { gap: var(--s-xl); }
    .hero-copy { padding-block: var(--s-xl); }
    .hero-lead { max-width: 100%; }
  }
  @media (max-width: 480px) {
    .hero h1 { font-size: clamp(2rem, 10vw, 2.75rem); }
    .hero-ctas { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">17a · iso grid · depth occlusion</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>
  <nav class="lab-nav-links"><a href="#">Projects</a><a href="#">Constitution</a></nav>
  <a class="btn btn-ghost btn-sm" href="#">GitHub</a>
</header>
<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        <h1>One person.<br>Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>
      <div class="hero-visual">
        <svg id="iso" viewBox="0 0 540 420" role="img"
          aria-label="Isometric blueprint: roxabi-factory core surrounded by module blocks llmCLI, voiceCLI, imageCLI, cortex, intel, idna on a grid; amber dataflow particles from the top pass behind the central cube, particles from the bottom stop at its edge in front of it"></svg>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  'use strict';
  var svg    = document.getElementById('iso');
  var SVGNS  = 'http://www.w3.org/2000/svg';
  var CX = 270, CY = 196;
  var GCX = 270, GCY = 250, TW = 30, TH = 15;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ── tunables ──
  var R = 150, CORE_S = 1.7, DOTS_PER_EDGE = 3, DOT_R = 3, BASE_SPEED = 0.0024;
  var BOT_STOP_DIST = 40;   // bottom particles halt this many px short of the core centre

  // fixed paint order (back → front), exactly as specified:
  //   grid (0) · top cubes (10) · top particles (25) · core logo (50) · bottom particles (75) · bottom cubes (100) · labels

  var defs =
    '<defs>' +
    '<radialGradient id="fbCore" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0%" stop-color="#fde68a"/><stop offset="35%" stop-color="#fbbf24"/>' +
    '<stop offset="100%" stop-color="#f0b429" stop-opacity="0.25"/></radialGradient>' +
    '<filter id="fbBloom" x="-80%" y="-80%" width="260%" height="260%">' +
    '<feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">' +
    '<stop offset="0%" stop-color="#f0b429" stop-opacity="0.35"/><stop offset="70%" stop-color="#f0b429" stop-opacity="0"/></radialGradient>' +
    '</defs>';

  function iso(gx, gy) { return [GCX + (gx - gy) * TW, GCY + (gx + gy) * TH]; }
  function byY(a, b) { return a.y - b.y; }

  // ── Grid plane ──
  var grid = '';
  for (var g = -5; g <= 5; g++) {
    var a1 = iso(g, -5), a2 = iso(g, 5), b1 = iso(-5, g), b2 = iso(5, g);
    var cls = (g === 0) ? 'grid-line accent' : 'grid-line';
    grid += '<line class="' + cls + '" x1="' + a1[0] + '" y1="' + a1[1] + '" x2="' + a2[0] + '" y2="' + a2[1] + '"/>';
    grid += '<line class="' + cls + '" x1="' + b1[0] + '" y1="' + b1[1] + '" x2="' + b2[0] + '" y2="' + b2[1] + '"/>';
  }

  // ── Module positions (iso-flattened hexagon) ──
  var names = ['llmCLI', 'voiceCLI', 'imageCLI', 'cortex', 'intel', 'idna'];
  var mods  = names.map(function (n, k) {
    var a = (-90 + k * 60) * Math.PI / 180;
    return { x: CX + R * Math.cos(a), y: CY + R * 0.5 * Math.sin(a), s: 1.0, label: n };
  });
  var core = { x: CX, y: CY, s: CORE_S, core: true, label: 'factory' };
  var topMods = mods.filter(function (m) { return m.y < CY; });   // llmCLI, voiceCLI, idna
  var botMods = mods.filter(function (m) { return m.y >= CY; });  // imageCLI, cortex, intel

  // ── Connectors (sit with the grid, behind everything else) ──
  var links = '';
  mods.forEach(function (m) {
    links += '<path class="link" d="M' + CX + ',' + CY + ' L' + m.x.toFixed(1) + ',' + m.y.toFixed(1) + '"/>';
  });

  // ── Cube builder (faithful to the logo iso block) ──
  function cube(o) {
    var t = 'translate(' + o.x.toFixed(1) + ',' + o.y.toFixed(1) + ') scale(' + o.s + ') translate(-32,-32)';
    var id = o.core ? ' id="isoCore"' : '';
    var s = '<g' + id + ' transform="' + t + '">';
    if (o.core) s += '<ellipse cx="32" cy="34" rx="30" ry="20" fill="url(#coreGlow)"/>';
    s += '<polygon points="12,22 32,32 32,52 12,42" fill="#11161d"/>';
    s += '<polygon points="52,22 52,42 32,52 32,32" fill="#171e27"/>';
    s += '<polygon points="32,12 52,22 32,32 12,22" fill="#1c2431"/>';
    if (o.core) {
      s += '<ellipse cx="32" cy="22" rx="9" ry="5" fill="url(#fbCore)" filter="url(#fbBloom)" opacity="0.9"/>';
      s += '<polygon points="32,16 44,22 32,28 20,22" fill="url(#fbCore)" stroke="#fbbf24" stroke-width="0.8" filter="url(#fbBloom)"/>';
    } else {
      s += '<circle cx="32" cy="22" r="2" fill="#f0b429" opacity="0.8"/>';
    }
    var ew = o.core ? 1.5 : 1.1, eop = o.core ? 1 : 0.5;
    s += '<path d="M32,12 52,22 52,42 32,52 12,42 12,22Z" fill="none" stroke="#f0b429" stroke-width="' + ew + '" stroke-opacity="' + eop + '" stroke-linejoin="round"/>';
    s += '</g>';
    return s;
  }

  var topCubes = topMods.slice().sort(byY).map(cube).join('');
  var botCubes = botMods.slice().sort(byY).map(cube).join('');

  // ── Labels (legible, on top) ──
  var labels = '';
  mods.forEach(function (m) {
    labels += '<text class="mlabel" x="' + m.x.toFixed(1) + '" y="' + (m.y + 34).toFixed(1) + '" text-anchor="middle">' + m.label + '</text>';
  });
  labels += '<text class="clabel" x="' + CX + '" y="' + (CY + 44) + '" text-anchor="middle">roxabi-factory</text>';

  // ── Assemble the z-stack as discrete groups ──
  svg.innerHTML =
    defs +
    '<g aria-hidden="true">' + grid + links + '</g>' +     // z 0  — grid + connectors
    '<g aria-hidden="true">' + topCubes + '</g>' +          // z 10 — 3 top cubes
    '<g id="zTopP" aria-hidden="true"></g>' +               // z 25 — top particles
    '<g aria-hidden="true">' + cube(core) + '</g>' +        // z 50 — big logo cube
    '<g id="zBotP" aria-hidden="true"></g>' +               // z 75 — bottom particles
    '<g aria-hidden="true">' + botCubes + '</g>' +          // z 100 — 3 bottom cubes
    '<g aria-hidden="true">' + labels + '</g>';             // labels

  var topP = svg.querySelector('#zTopP');
  var botP = svg.querySelector('#zBotP');

  // ── Particles: assigned to a fixed layer by origin (top vs bottom) ──
  var particles = [];
  mods.forEach(function (mod, idx) {
    var bottom = mod.y >= CY;
    var layer  = bottom ? botP : topP;
    var D      = Math.hypot(mod.x - CX, mod.y - CY);
    var tStop  = bottom ? Math.max(0.3, Math.min(0.92, 1 - BOT_STOP_DIST / D)) : 1;
    for (var j = 0; j < DOTS_PER_EDGE; j++) {
      var c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('r', DOT_R);
      c.setAttribute('fill', '#f0b429');
      layer.appendChild(c);
      particles.push({ mod: mod, bottom: bottom, tStop: tStop, t: (j / DOTS_PER_EDGE) * tStop,
                       speed: BASE_SPEED + j * 0.0004 + idx * 0.0001, el: c });
    }
  });

  function place(p, t) {
    p.el.setAttribute('cx', (p.mod.x + (CX - p.mod.x) * t).toFixed(1));
    p.el.setAttribute('cy', (p.mod.y + (CY - p.mod.y) * t).toFixed(1));
  }

  var coreEl = document.getElementById('isoCore');
  var baseT  = coreEl.getAttribute('transform');

  // reduced-motion: one composed, depth-correct frame, no rAF
  if (reduce) {
    particles.forEach(function (p, i) {
      var t = p.bottom ? p.tStop * (0.45 + 0.2 * (i % 3)) : (0.4 + 0.2 * (i % 3));
      place(p, t);
      p.el.setAttribute('opacity', '0.72');
    });
    return;
  }

  var running = true, raf = 0;
  function frame(now) {
    if (!running) return;
    var dy = Math.sin(now / 900) * 4;
    coreEl.setAttribute('transform', baseT + ' translate(0,' + dy.toFixed(2) + ')');

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.t += p.speed;
      if (p.t >= p.tStop) p.t -= p.tStop;     // loop within its (possibly shortened) range
      place(p, p.t);
      var u = p.t / p.tStop;                   // 0..1 over the travelled span
      // top: emerge from the cube, the core swallows the tail · bottom: emerge, then settle at the core edge
      var alpha = p.bottom
        ? 0.9 * Math.min(u * 5, 1) * Math.min((1 - u) * 6, 1)
        : 0.9 * Math.min(u * 6, 1);
      p.el.setAttribute('opacity', alpha.toFixed(2));
    }
    raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden && !reduce;
    if (running) raf = requestAnimationFrame(frame);
  });
  if (!reduce) raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
