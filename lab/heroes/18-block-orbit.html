<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 18 — Block + orbit rings · Roxabi lab</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="./_base.css">
<style>
/* ── Hero layout ────────────────────────────────────────────── */
.hero {
  padding-block: var(--s-2xl);
}
.hero .wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: var(--s-2xl);
  min-height: calc(100svh - 60px);
}

/* ── Copy column ────────────────────────────────────────────── */
.hero-copy {
  display: flex;
  flex-direction: column;
  gap: var(--s-lg);
  position: relative;
  z-index: 3;
}
.hero-copy h1 {
  color: var(--text);
}
.hero-sub {
  color: var(--accent);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: .01em;
  line-height: 1.3;
}
.hero-lead {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.65;
  max-width: 38ch;
}
.hero-ctas {
  display: flex;
  gap: var(--s-md);
  flex-wrap: wrap;
  align-items: center;
}
@media (min-width: 820px) {
  .hero-copy {
    padding-bottom: var(--s-xl);
  }
}

/* ── Visual column ──────────────────────────────────────────── */
.hero-visual {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: calc(-1 * var(--s-lg));
  /* orbit canvas must be square to match VB coords */
}

/* ── Orbit stage ────────────────────────────────────────────── */
/*  Contains: grid, spotlight, glow, block, orbit rings, satellites */
.orbit-stage {
  position: relative;
  width: min(460px, 92vw);
  height: min(460px, 92vw);
}

/* Radial amber spotlight behind the block */
.hero-spotlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.hero-spotlight::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -55%;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(
    circle at center,
    rgba(240,180,41,.16) 0%,
    rgba(240,180,41,.08) 28%,
    rgba(240,180,41,.02) 55%,
    transparent 70%
  );
}

/* Tight amber halo on block perimeter */
.hero-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 45%,
    rgba(240,180,41,.11) 0%,
    transparent 65%
  );
  pointer-events: none;
  z-index: 1;
}

/* Decorative perspective grid behind block */
.hero-grid {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .15;
  overflow: hidden;
}
.hero-grid svg {
  width: 100%;
  height: 100%;
}

/* SVG orbit rings overlay — fills stage, behind block */
.orbit-rings-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  /* z-index set per satellite; rings themselves sit behind block */
}
.orbit-rings-svg ellipse {
  fill: none;
  stroke: var(--accent);
  stroke-opacity: .13;
  stroke-width: 1;
}

/* The animated block SVG wrapper — centered in stage, z-index 10 (mid-stack) */
.hero-block {
  position: absolute;
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  z-index: 10;
  width: min(300px, 65%);
  height: min(300px, 65%);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: blockFloat 6s ease-in-out infinite;
  will-change: transform;
}
.hero-block svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 28px rgba(240,180,41,.26)) drop-shadow(0 0 7px rgba(240,180,41,.16));
}

@keyframes blockFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33%       { transform: translateY(-8px) rotate(.35deg); }
  66%       { transform: translateY(-3px) rotate(-.25deg); }
}

/* Satellite chips — absolutely positioned inside orbit-stage */
.sat {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 5px;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  will-change: left, top, opacity;
  pointer-events: none;
}
.sat .sd {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  flex: none;
}
.sat .sl {
  font-family: var(--font-mono);
  font-size: .68rem;
  color: var(--text);
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  border: 1px solid var(--border-hi);
  border-radius: var(--r-full);
  padding: 2px 7px;
}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width: 820px) {
  .hero .wrap {
    grid-template-columns: 1fr;
    gap: var(--s-xl);
    min-height: unset;
    padding-block: var(--s-2xl);
  }
  .hero-copy { order: 1; }
  .hero-visual {
    order: 0;
    margin-right: 0;
    justify-content: center;
  }
  .orbit-stage {
    width: min(340px, 88vw);
    height: min(340px, 88vw);
  }
  .hero-block {
    width: min(220px, 62%);
    height: min(220px, 62%);
  }
  .hero-lead { max-width: none; }
}

/* ── Reduced-motion static state ────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .hero-block { animation: none !important; }
}
</style>
</head>
<body>
<a class="lab-back" href="./index.html">← gallery</a>
<span class="lab-tag">18 · block + orbit rings</span>
<header class="lab-nav">
  <a class="brand" href="#"><img src="/assets/logo/foundation-block.svg" width="26" height="26" alt=""><span>Roxabi</span></a>

<main>
  <section class="hero">
    <div class="wrap">

      <!-- Copy -->
      <div class="hero-copy">
        <div>
          <span class="badge"><span class="dot"></span>AGPL-3.0 · Open by architecture</span>
        </div>
        <h1>One person.<br>Team-scale output.</h1>
        <p class="hero-sub">Pre-wired. Open. Yours.</p>
        <p class="hero-lead">An agent &amp; worker factory. Open-source tools plug in over NATS, CLI, skills, or API.</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#">Explore the projects →</a>
          <a class="btn btn-ghost" href="#">GitHub</a>
        </div>
      </div>

      <!-- Visual: block centerpiece + elliptical orbit satellites -->
      <div class="hero-visual" aria-hidden="true">
        <div class="orbit-stage" id="orbitStage">

          <!-- Ambient spotlight wash -->
          <div class="hero-spotlight"></div>
          <div class="hero-glow"></div>

          <!-- Decorative perspective grid (behind everything) -->
          <div class="hero-grid">
            <svg viewBox="0 0 460 460" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="gridFade" cx="50%" cy="42%" r="52%">
                  <stop offset="0%" stop-color="#f0b429" stop-opacity="1"/>
                  <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <line x1="0"   y1="270" x2="460" y2="270" stroke="url(#gridFade)" stroke-width=".8"/>
              <line x1="0"   y1="305" x2="460" y2="305" stroke="url(#gridFade)" stroke-width=".6"/>
              <line x1="0"   y1="340" x2="460" y2="340" stroke="url(#gridFade)" stroke-width=".5"/>
              <line x1="0"   y1="375" x2="460" y2="375" stroke="url(#gridFade)" stroke-width=".4"/>
              <line x1="230" y1="210" x2="0"   y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
              <line x1="230" y1="210" x2="76"  y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
              <line x1="230" y1="210" x2="153" y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
              <line x1="230" y1="210" x2="230" y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
              <line x1="230" y1="210" x2="307" y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
              <line x1="230" y1="210" x2="384" y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
              <line x1="230" y1="210" x2="460" y2="460" stroke="url(#gridFade)" stroke-width=".7"/>
            </svg>
          </div>

          <!-- Orbit ring SVG (two tilted ellipses) — satellites pass in/out of z-order via JS -->
          <svg class="orbit-rings-svg" viewBox="0 0 460 460" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <!-- Ring A: outer, tilt -14° -->
            <ellipse cx="230" cy="230" rx="192" ry="80"  transform="rotate(-14 230 230)"/>
            <!-- Ring B: inner, tilt +22° -->
            <ellipse cx="230" cy="230" rx="140" ry="108" transform="rotate(22 230 230)"/>
          </svg>

          <!-- Foundation-block centerpiece (z-index 10 via CSS) -->
          <div class="hero-block">
            <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
              <defs>
                <radialGradient id="hCore" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"  stop-color="#fff7d6"/>
                  <stop offset="30%" stop-color="#fde68a"/>
                  <stop offset="70%" stop-color="#f0b429"/>
                  <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="hLeft" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%"  stop-color="#0b1016"/>
                  <stop offset="100%" stop-color="#11181f"/>
                </linearGradient>
                <linearGradient id="hRight" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%"  stop-color="#151c24"/>
                  <stop offset="100%" stop-color="#1b2330"/>
                </linearGradient>
                <linearGradient id="hTop" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%"  stop-color="#1e2a38"/>
                  <stop offset="100%" stop-color="#19222e"/>
                </linearGradient>
                <filter id="hBloom" x="-80%" y="-80%" width="260%" height="260%">
                  <feGaussianBlur stdDeviation="5" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="hAmbient" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="18" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="hEdge" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="2.5" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <filter id="hBevel" x="-10%" y="-10%" width="120%" height="120%">
                  <feGaussianBlur stdDeviation="1.2" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>

              <!-- Ambient glow ghost -->
              <polygon points="160,36 234,81 234,171 160,216 86,171 86,81"
                fill="none" stroke="#f0b429" stroke-width="24" opacity=".06"
                filter="url(#hAmbient)"/>

              <!-- Three cube faces -->
              <polygon points="86,81  160,126 160,216 86,171"  fill="url(#hLeft)"/>
              <polygon points="234,81 234,171 160,216 160,126" fill="url(#hRight)"/>
              <polygon points="160,36 234,81  160,126 86,81"   fill="url(#hTop)"/>

              <!-- Top face bevel -->
              <polygon points="160,36 234,81 160,126 86,81"
                fill="none" stroke="#263040" stroke-width="1" opacity=".9"/>

              <!-- Edge highlights -->
              <line x1="86" y1="81" x2="160" y2="36"
                stroke="#2e3e52" stroke-width="1.5" opacity=".8"/>
              <line x1="160" y1="36" x2="234" y2="81"
                stroke="#243040" stroke-width="1.5" opacity=".6"/>

              <!-- Amber outline silhouette -->
              <polygon points="160,36 234,81 234,171 160,216 86,171 86,81"
                fill="none" stroke="#f0b429" stroke-width="2.5" stroke-linejoin="round"
                filter="url(#hEdge)" opacity=".9"/>

              <!-- Internal structure lines -->
              <line x1="86"  y1="81"  x2="160" y2="126"
                stroke="#f0b429" stroke-width="1.6"
                opacity=".6" filter="url(#hEdge)"/>
              <line x1="234" y1="81"  x2="160" y2="126"
                stroke="#f0b429" stroke-width="1.6"
                opacity=".5" filter="url(#hEdge)"/>
              <line x1="160" y1="126" x2="160" y2="216"
                stroke="#f0b429" stroke-width="1.6"
                opacity=".5" filter="url(#hEdge)"/>

              <!-- Open top aperture halo -->
              <ellipse cx="160" cy="81" rx="38" ry="21"
                fill="url(#hCore)" filter="url(#hAmbient)" opacity=".7"/>

              <!-- Open top aperture diamond -->
              <polygon points="160,54 202,81 160,108 118,81"
                fill="url(#hCore)"
                stroke="#fbbf24" stroke-width="1.5"
                filter="url(#hBloom)" opacity=".95"/>

              <!-- Corner accent dots -->
              <circle cx="160" cy="36"  r="3.5" fill="#f0b429" opacity=".5" filter="url(#hBevel)"/>
              <circle cx="86"  cy="81"  r="3"   fill="#f0b429" opacity=".35" filter="url(#hBevel)"/>
              <circle cx="234" cy="81"  r="3"   fill="#f0b429" opacity=".35" filter="url(#hBevel)"/>
              <circle cx="160" cy="126" r="3"   fill="#f0b429" opacity=".3"  filter="url(#hBevel)"/>
            </svg>
          </div>

          <!-- Satellite chips injected by JS -->

        </div>
      </div>

    </div>
  </section>
</main>
<script>
(function () {
  'use strict';

  var stage   = document.getElementById('orbitStage');
  var reduce  = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var VB      = 460, C = 230, DEG = Math.PI / 180;

  /* Two rings: rx, ry, rotation(deg), angular speed (rad/s) */
  var rings = [
    { rx: 192, ry: 80,  rot: -14, sp:  0.13 },  /* outer ring A */
    { rx: 140, ry: 108, rot:  22, sp: -0.17 }   /* inner ring B */
  ];

  /* 4 satellites: ring index, start angle (deg), label */
  var defs = [
    { r: 0, a:   0, l: 'llmCLI'   },
    { r: 0, a: 180, l: 'imageCLI' },
    { r: 1, a:  80, l: 'voiceCLI' },
    { r: 1, a: 255, l: 'cortex'   }
  ];

  /* Build satellite DOM nodes */
  var sats = defs.map(function (d) {
    var el  = document.createElement('span');
    el.className = 'sat';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<span class="sd"></span><span class="sl">' + d.l + '</span>';
    stage.appendChild(el);
    return { el: el, ring: rings[d.r], ang: d.a * DEG };
  });

  /* Position one satellite according to elliptical orbit math + depth z-order */
  function place(s) {
    var rg = s.ring;
    /* Local ellipse point */
    var lx = rg.rx * Math.cos(s.ang);
    var ly = rg.ry * Math.sin(s.ang);
    /* Rotate by ring tilt */
    var cr = Math.cos(rg.rot * DEG), sr = Math.sin(rg.rot * DEG);
    var x  = C + lx * cr - ly * sr;
    var y  = C + lx * sr + ly * cr;

    /* Depth cue: sin(ang) > 0 → bottom half of ellipse → front */
    var front = Math.sin(s.ang);      /* -1 back … +1 front */
    var t     = (front + 1) / 2;     /* 0..1 */

    /* Satellites are visibly smaller & dimmer than 15 — they're accents */
    var scale  = (0.55 + 0.30 * t).toFixed(3);   /* 0.55 → 0.85 */
    var opac   = (0.30 + 0.50 * t).toFixed(2);   /* 0.30 → 0.80 */

    s.el.style.left      = (x / VB * 100).toFixed(2) + '%';
    s.el.style.top       = (y / VB * 100).toFixed(2) + '%';
    s.el.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
    s.el.style.opacity   = opac;
    /* Front satellites (sin>0) → z above block (z 20); back → z below (z 5) */
    s.el.style.zIndex    = front >= 0 ? 20 : 5;
  }

  /* Initial static placement */
  sats.forEach(place);

  /* Stop here for reduced-motion — static spread already painted */
  if (reduce) return;

  /* rAF loop */
  var last = 0, running = true, raf = 0;

  function frame(ts) {
    if (!running) return;
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    sats.forEach(function (s) {
      s.ang += s.ring.sp * dt;
      place(s);
    });
    raf = requestAnimationFrame(frame);
  }

  function start() { running = true; last = 0; raf = requestAnimationFrame(frame); }
  function stop()  { running = false; cancelAnimationFrame(raf); }

  start();

  /* Pause on hidden tab */
  document.addEventListener('visibilitychange', function () {
    document.hidden ? stop() : start();
  });

  /* Honour preference changes mid-session */
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function (e) {
    var block = document.querySelector('.hero-block');
    if (e.matches) {
      stop();
      if (block) block.style.animation = 'none';
    } else {
      if (block) block.style.animation = '';
      start();
    }
  });
})();
</script>
</body>
</html>
