<footer class="footer">
  <div class="wrap">
    <div class="footer-top">
      <div>
        <a class="brand" href="{{home_href}}"><img src="/assets/logo/foundation-block.svg" alt="" width="26" height="26"><span>Roxabi</span></a>
        <p class="mono-note" style="margin-top:var(--s-md);max-width:280px">{{footer_tagline}}</p>
      </div>
      <div class="footer-links">
        <div class="footer-col"><span class="h">{{f_product}}</span><a href="{{projects_href}}">{{nav_projects}}</a><a href="{{constitution_href}}">{{nav_constitution}}</a><a href="{{github}}" rel="noopener">{{f_github}}</a></div>
        <div class="footer-col"><span class="h">{{f_resources}}</span><a href="{{github}}" rel="noopener">{{f_docs_soon}}</a><a href="{{github}}" rel="noopener">{{f_changelog_soon}}</a></div>
        <div class="footer-col"><span class="h">{{f_portfolio}}</span><a href="https://github.com/Roxabi/roxabi-factory" rel="noopener">roxabi-factory</a><span class="mono-note">{{f_sibling}}</span></div>
        <div class="footer-col"><span class="h">{{f_legal}}</span><a href="{{legal_href}}">{{f_legal_notice}}</a><a href="https://opensource.org/license/agpl-v3" rel="noopener">AGPL-3.0</a></div>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <span>{{f_copyright}}</span>
    <span class="mono-note">{{footer_note}}</span>
  </div>
</footer>
