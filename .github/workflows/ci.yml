name: CI

permissions:
  contents: read
  checks: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only on feature branches; protected main runs to completion so every
  # merge-commit SHA has a recorded status.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Processed PR merge → skip suite. Naked push → run suite.
  # ~/projects/ssot/conventions.ssot.md § CI landing
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
          n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)] | length')"
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)][0].head.sha')"
            conc="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select((.name | ascii_downcase) == "ci") | .conclusion] | map(select(. == "success")) | if length > 0 then "success" else "missing" end')"
            if [ "$conc" = "success" ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  ci:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Zero-dependency Python-stdlib SSG: ubuntu-latest ships Python 3.12 (>= 3.11),
      # so no setup step is needed. The gate builds dist/ and asserts the audit
      # invariants (HTML balance, WCAG-AA contrast, FR a11y tree, NNBSP).
      - name: Build + verify invariants
        run: python3 tools/check_build.py
