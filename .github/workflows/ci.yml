name: CI

permissions:
  contents: read
  checks: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only on feature branches; protected main runs to completion so every
  # merge-commit SHA has a recorded status.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Zero-dependency Python-stdlib SSG: ubuntu-latest ships Python 3.12 (>= 3.11),
      # so no setup step is needed. The gate builds dist/ and asserts the audit
      # invariants (HTML balance, WCAG-AA contrast, FR a11y tree, NNBSP).
      - name: Build + verify invariants
        run: python3 tools/check_build.py
